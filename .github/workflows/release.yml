# Builds the addon zip and publishes a GitHub release when a version tag
# (for example v1.0.0) is pushed.
#
# The zip contains only the WarriorMaster addon folder, ready to extract into
# World of Warcraft\_forever_\Interface\AddOns\. The release is refused if
# the offline test suite fails or if the tag does not match the TOC version.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the offline test suite
        run: |
          python -m pip install --quiet lupa
          python tests/run_tests.py

      - name: Check that the tag matches the TOC version
        run: |
          toc_version=$(grep -m1 '^## Version:' WarriorMaster/WarriorMaster.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          if [ "v${toc_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the TOC version ${toc_version}"
            exit 1
          fi

      - name: Build the addon zip
        run: |
          zip -r -X "WarriorMaster-${GITHUB_REF_NAME}.zip" WarriorMaster
          unzip -l "WarriorMaster-${GITHUB_REF_NAME}.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "WarriorMaster-${GITHUB_REF_NAME}.zip" \
            --title "Warrior Master ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
